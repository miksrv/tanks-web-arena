name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  # Manual run from the Actions tab or `gh workflow run deploy.yml`
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install LFTP
        run: sudo apt-get install -y lftp

      # One lftp session. The secrets reach it as environment variables, never pasted into the
      # script (a password with `"`, `$` or a space stays intact), and the server's certificate is
      # verified (lftp's default). The site is static: Vite writes index.html plus hashed bundles
      # in assets/. The new bundles are uploaded first (old ones kept), then the new index.html
      # that references them, and only then are the bundles of previous builds deleted: a page
      # loaded at any moment finds every file it asks for. Only assets/ is synced with `--delete`:
      # nothing else on the hosting is touched. Every other file from public/ must be listed here
      # explicitly, or it never reaches the site.
      - name: Upload site
        env:
          FTP_HOSTNAME: ${{ secrets.FTP_HOSTNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_HOSTNAME" <<'EOF'
          set cmd:fail-exit yes
          mirror -R --parallel=10 assets /assets
          put -O / index.html
          mirror -R --delete --parallel=10 assets /assets
          put -O / .htaccess
          put -O / og-image.jpg
          bye
          EOF
        working-directory: dist
